<!DOCTYPE html>
<head>
    <script src="https://n8n-io.github.io/node_modules/@webcomponents/webcomponentsjs/webcomponents-loader.js"></script>
    <script src="https://n8n-io.github.io/node_modules/lit/polyfill-support.js"></script>
    <script type="module" src="https://n8n-io.github.io/n8n-demo-webcomponent/n8n-demo.bundled.js"></script>

    <style>
        n8n-demo {
            --n8n-frame-background-color: white;
            --n8n-json-background-color: lightgray;
            --n8n-copy-button-background-color: gray;
            --n8n-workflow-min-height: 500px;
            --n8n-iframe-border-radius: 30px;
        }

        .n8n-demo-container {
            margin-bottom: 100px;
            padding-bottom: 100px;
            border-bottom: 1px solid lightgray;
        }
    </style>
</head>
<body>
    <div style="max-width: 90%; margin: 0 auto;">
        <div class="n8n-demo-container">
            <h2>Subworflow to create Data Tables based on Input</h2>
            <n8n-demo class="n8n-ensure_table_sub" workflow="" frame="true" tidyup="true"></n8n-demo>
        </div>
        <div class="n8n-demo-container">
            <h2>Workflow for forwarding Email to correct department</h2>
            <n8n-demo class="n8n-email_dispatcher" workflow="" frame="true" tidyup="true"></n8n-demo>
        </div>

        <div class="n8n-demo-container">
            <h2>RAG to Vector DB</h2>
            <n8n-demo class="n8n-rag_basic" workflow="" frame="true" tidyup="true"></n8n-demo>
        </div>
    </div>

    <script>
        const ensureTable = fetch('https://fledev.github.io/tech/ai/n8n/templates/Ensure_Table_sub.json').then(response => response.json()).then(data => {
            document.querySelector('.n8n-ensure_table_sub').workflow = JSON.stringify(data);
        });

        const emailDispatcher = fetch('https://fledev.github.io/tech/ai/n8n/templates/Email_Dispatcher.json').then(response => response.json()).then(data => {
            document.querySelector('.n8n-email_dispatcher').workflow = JSON.stringify(data);
        });

        const ragBasic = fetch('https://fledev.github.io/tech/ai/n8n/templates/RagBasic.json').then(response => response.json()).then(data => {
            document.querySelector('.n8n-rag_basic').workflow = JSON.stringify(data);
        });
    </script>
</body>
</html>
